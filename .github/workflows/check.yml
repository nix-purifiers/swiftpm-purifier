            ${{ runner.temp }}/checkout2-swift503-native/host-default/project/swiftpm-purifier.lock.json
            ${{ runner.temp }}/checkout2-swift503-native/external-native
            ${{ runner.temp }}/checkout2-swift503-native/external-portable
