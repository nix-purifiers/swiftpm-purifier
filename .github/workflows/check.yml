# SPDX-License-Identifier: MIT
#
# Checks every pull request and every push to main.
#
# `flake-check` builds the flake's checks: the fixtures offline from their
# lockfiles, the conformance checks that run in the sandbox, the
# swiftpm-purifier command with its unit tests, and the formatting. The
# other jobs run the sections of tests/cli.sh, which need the network or
# run Nix, and so cannot run in the Nix sandbox. Each job is named for the
# contract check it runs. A runner forbids unprivileged user namespaces, so
# conformance-offline cuts the network with a network namespace that root
# creates, and runs the commands as the runner user inside it, through the
# command in SWIFTPM_PURIFIER_TEST_OFFLINE.
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dependencies-v1-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Prepare the explicit original Swift 4 fixture
        env:
          FIXTURE_SOURCE: ${{ github.workspace }}
        run: |
          nix build --impure --no-link --json --expr '
            let
              f = builtins.getFlake ("path:" + builtins.getEnv "FIXTURE_SOURCE");
              p = import f.inputs.nixpkgs { system = builtins.currentSystem; };
            in import (f.outPath + "/tests/sdk/swift403/default.nix") { pkgs = p; }
          ' > "$RUNNER_TEMP/dependencies-v1-runtime-build.json"
          runtime=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))[0]["outputs"]["out"])' "$RUNNER_TEMP/dependencies-v1-runtime-build.json")
          mkdir -p "$RUNNER_TEMP/dependencies-v1-sdk-metadata"
          cp "$runtime/original-tool-bytes.json" "$runtime/original-runtime-bytes.json" "$runtime/original-header-relocations.json" "$RUNNER_TEMP/dependencies-v1-sdk-metadata/"
          nix build --impure --no-link --print-out-paths --expr '
            let
              f = builtins.getFlake ("path:" + builtins.getEnv "FIXTURE_SOURCE");
              p = import f.inputs.nixpkgs { system = builtins.currentSystem; };
            in p.nix-prefetch-git
          ' > "$RUNNER_TEMP/dependencies-v1-prefetch-prefix"
          nix build --no-link --print-out-paths "path:$FIXTURE_SOURCE#default" > "$RUNNER_TEMP/dependencies-v1-cli-prefix"
      - name: Validate readers and original native transitive builds
        run: |
          python3 tests/dependencies-v1-codec-parity.py --output "$RUNNER_TEMP/dependencies-v1-codec"
          python3 tests/dependencies-v1-layout-parity.py --output "$RUNNER_TEMP/dependencies-v1-layout"
          python3 tests/dependencies-v1-pure.py > "$RUNNER_TEMP/dependencies-v1-readers.json"
          runtime=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))[0]["outputs"]["out"])' "$RUNNER_TEMP/dependencies-v1-runtime-build.json")
          prefetch=$(cat "$RUNNER_TEMP/dependencies-v1-prefetch-prefix")
          cli=$(cat "$RUNNER_TEMP/dependencies-v1-cli-prefix")
          python3 tests/dependencies-v1-pure-native.py --transitive --runtime-prefix "$runtime" --nix-prefetch-git "$prefetch/bin/nix-prefetch-git" --cli "$cli/bin/swiftpm-purifier" --work "$RUNNER_TEMP/dependencies-v1-native"
      - name: Package native state and product evidence
        if: always()
        run: python3 tests/dependencies-v1-pack-evidence.py --root "$RUNNER_TEMP"
      - name: Retain native state and product evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependencies-v1-swift403
          path: |
            ${{ runner.temp }}/dependencies-v1-evidence.tar.gz
            ${{ runner.temp }}/dependencies-v1-evidence-manifest.json
  checkout2-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        selector: [default, external]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Prepare the original Swift 4.1 fixture and installed CLI
        env:
          FIXTURE_SOURCE: ${{ github.workspace }}
        run: |
          nix build --impure --no-link --json --expr '
            let
              f = builtins.getFlake ("path:" + builtins.getEnv "FIXTURE_SOURCE");
              p = import f.inputs.nixpkgs { system = builtins.currentSystem; };
            in import (f.outPath + "/tests/sdk/swift413/default.nix") { pkgs = p; }
          ' > "$RUNNER_TEMP/checkout2-runtime-build.json"
          runtime=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))[0]["outputs"]["out"])' "$RUNNER_TEMP/checkout2-runtime-build.json")
          mkdir -p "$RUNNER_TEMP/checkout2-sdk-metadata"
          cp "$runtime/original-tool-bytes.json" "$runtime/original-runtime-bytes.json" "$runtime/original-header-relocations.json" "$RUNNER_TEMP/checkout2-sdk-metadata/"
          nix build --impure --no-link --print-out-paths --expr '
            let
              f = builtins.getFlake ("path:" + builtins.getEnv "FIXTURE_SOURCE");
              p = import f.inputs.nixpkgs { system = builtins.currentSystem; };
            in p.nix-prefetch-git
          ' > "$RUNNER_TEMP/checkout2-prefetch-prefix"
          nix build --no-link --print-out-paths "path:$FIXTURE_SOURCE#default" > "$RUNNER_TEMP/checkout2-cli-prefix"
      - name: Exercise cold native and pure builds
        env:
          SELECTOR: ${{ matrix.selector }}
        run: |
          runtime=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))[0]["outputs"]["out"])' "$RUNNER_TEMP/checkout2-runtime-build.json")
          prefetch=$(cat "$RUNNER_TEMP/checkout2-prefetch-prefix")
          cli=$(cat "$RUNNER_TEMP/checkout2-cli-prefix")
          extra=()
          if [ "$SELECTOR" = external ]; then extra+=(--external); fi
          python3 tests/checkout2-native-lifecycle.py --transitive --runtime-prefix "$runtime" --nix-prefetch-git "$prefetch/bin/nix-prefetch-git" --cli "$cli/bin/swiftpm-purifier" --work "$RUNNER_TEMP/checkout2-native" "${extra[@]}"
      - name: Retain checkout2 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: checkout2-swift413-${{ matrix.selector }}
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/checkout2-runtime-build.json
            ${{ runner.temp }}/checkout2-sdk-metadata
            ${{ runner.temp }}/checkout2-native/receipt.json
            ${{ runner.temp }}/checkout2-native/logs
            ${{ runner.temp }}/checkout2-native/pure-source
            ${{ runner.temp }}/checkout2-native/tmp/swiftpm-purifier-legacy-runtime-*/receipt.json
            ${{ runner.temp }}/checkout2-native/tmp/swiftpm-purifier-legacy-runtime-*/logs
            ${{ runner.temp }}/checkout2-native/host-default/project/Package.resolved
            ${{ runner.temp }}/checkout2-native/host-default/project/swiftpm-purifier.lock.json
            ${{ runner.temp }}/checkout2-native/external-native
            ${{ runner.temp }}/checkout2-native/external-portable
