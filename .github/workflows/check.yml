# SPDX-License-Identifier: MIT
#
# Checks every pull request and every push to main.
#
# `flake-check` builds the flake's checks: the fixtures offline from their
# lockfiles, the conformance checks that run in the sandbox, the
# swiftpm-purifier command with its unit tests, and the formatting. The
# other jobs run the sections of tests/cli.sh, which need the network or
# run Nix, and so cannot run in the Nix sandbox. Each job is named for the
# contract check it runs. A runner forbids unprivileged user namespaces, so
# conformance-offline cuts the network with a network namespace that root
# creates, and runs the commands as the runner user inside it, through the
# command in SWIFTPM_PURIFIER_TEST_OFFLINE.
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  host-runtime-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Use the runtime already installed on the runner
        run: python3 tests/host-runtime-lifecycle.py --output "$RUNNER_TEMP/host-runtime"
      - name: Retain host runtime and dependency replay evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: host-runtime
          path: |
            ${{ runner.temp }}/host-runtime/receipt.json
            ${{ runner.temp }}/host-runtime/logs
            ${{ runner.temp }}/host-runtime/original/Package.resolved
            ${{ runner.temp }}/host-runtime/original/swiftpm-purifier.lock.json
            ${{ runner.temp }}/host-runtime/relocated/Package.resolved
            ${{ runner.temp }}/host-runtime/relocated/swiftpm-purifier.lock.json
            ${{ runner.temp }}/host-runtime/relocated/.build/swiftpm-purifier/observed-host-runtime.json
          if-no-files-found: error

  native-sdk-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        epoch: [swift553, default]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Validate native and SDK metadata readers
        run: |
          python3 tests/native-reader-parity.py --output "$RUNNER_TEMP/native-readers"
          python3 tests/sdk-reader-parity.py --output "$RUNNER_TEMP/sdk-readers"
      - name: Exercise the selected native SDK
        run: python3 tests/native-sdk-lifecycle.py --epoch '${{ matrix.epoch }}' --output "$RUNNER_TEMP/native-sdk"
      - name: Retain bounded commands and native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-sdk-${{ matrix.epoch }}
          path: |
            ${{ runner.temp }}/native-readers
            ${{ runner.temp }}/sdk-readers
            ${{ runner.temp }}/native-sdk/receipt.json
            ${{ runner.temp }}/native-sdk/logs
            ${{ runner.temp }}/native-sdk/tmp/swiftpm-purifier-sdk-*/receipt.json
            ${{ runner.temp }}/native-sdk/tmp/swiftpm-purifier-sdk-*/logs
            ${{ runner.temp }}/native-sdk/original/Package.resolved
            ${{ runner.temp }}/native-sdk/original/swiftpm-purifier.lock.json
            ${{ runner.temp }}/native-sdk/relocated/Package.resolved
            ${{ runner.temp }}/native-sdk/relocated/swiftpm-purifier.lock.json
          if-no-files-found: error

  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Build the checks
        run: nix flake check --print-build-logs

  conformance-relock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Relock the fixtures
        run: nix shell 'nixpkgs#python3' -c tests/cli.sh relock

  conformance-rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Rebuild a fixture
        run: nix shell 'nixpkgs#python3' -c tests/cli.sh rebuild

  conformance-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Work with the network cut off
        run: |
          export SWIFTPM_PURIFIER_TEST_OFFLINE="sudo -E unshare -n setpriv --reuid=$(id -u) --regid=$(id -g) --clear-groups"
          nix shell 'nixpkgs#python3' -c tests/cli.sh offline

  conformance-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Update a fixture
        run: nix shell 'nixpkgs#python3' -c tests/cli.sh update

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Run the interactive, tampered and registry sections
        run: nix shell 'nixpkgs#python3' -c tests/cli.sh interactive tampered registry
