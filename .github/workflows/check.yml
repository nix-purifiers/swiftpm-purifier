# SPDX-License-Identifier: MIT
#
# Checks every pull request and every push to main.
#
# `flake-check` builds the flake's checks: the fixtures offline from their
# lockfiles, the conformance checks that run in the sandbox, the
# swiftpm-purifier command with its unit tests, and the formatting. The
# other jobs run the sections of tests/cli.sh, which need the network or
# run Nix, and so cannot run in the Nix sandbox. Each job is named for the
# contract check it runs. A runner forbids unprivileged user namespaces, so
# conformance-offline cuts the network with a network namespace that root
# creates, and runs the commands as the runner user inside it, through the
# command in SWIFTPM_PURIFIER_TEST_OFFLINE.
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  legacy-state-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Prepare the explicit historical runtime fixture
        env:
          LEGACY_SOURCE: ${{ github.workspace }}
        run: |
          nix build --impure --no-link --json --expr '
            let
              f = builtins.getFlake ("path:" + builtins.getEnv "LEGACY_SOURCE");
              p = import f.inputs.nixpkgs { system = builtins.currentSystem; };
            in import (f.outPath + "/tests/sdk/swift424/default.nix") { pkgs = p; }
          ' > "$RUNNER_TEMP/legacy-runtime-build.json"
          runtime=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))[0]["outputs"]["out"])' "$RUNNER_TEMP/legacy-runtime-build.json")
          mkdir -p "$RUNNER_TEMP/legacy-sdk-metadata"
          cp "$runtime/original-tool-bytes.json" "$runtime/original-runtime-bytes.json" "$runtime/original-header-relocations.json" "$RUNNER_TEMP/legacy-sdk-metadata/"
      - name: Exercise installed runtime capture and cold dependency replay
        run: |
          python3 tests/legacy-local-reader-parity.py --output "$RUNNER_TEMP/legacy-readers"
          runtime=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))[0]["outputs"]["out"])' "$RUNNER_TEMP/legacy-runtime-build.json")
          python3 tests/legacy-state-lifecycle.py --runtime-prefix "$runtime" --pure --output "$RUNNER_TEMP/legacy-state"
      - name: Retain historical runtime and replay evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: legacy-state-swift424
          path: |
            ${{ runner.temp }}/legacy-runtime-build.json
            ${{ runner.temp }}/legacy-sdk-metadata
            ${{ runner.temp }}/legacy-readers
            ${{ runner.temp }}/legacy-state/receipt.json
            ${{ runner.temp }}/legacy-state/logs
            ${{ runner.temp }}/legacy-state/native-dependencies-state.json
            ${{ runner.temp }}/legacy-state/fixture-before-capture
            ${{ runner.temp }}/legacy-state/leaf/Package.swift
            ${{ runner.temp }}/legacy-state/leaf/Sources
            ${{ runner.temp }}/legacy-state/remote
            ${{ runner.temp }}/legacy-state/relocated/Package.swift
            ${{ runner.temp }}/legacy-state/relocated/Sources
            ${{ runner.temp }}/legacy-state/relocated/Tests
            ${{ runner.temp }}/legacy-state/relocated/Local
            ${{ runner.temp }}/legacy-state/original/Package.resolved
            ${{ runner.temp }}/legacy-state/original/swiftpm-purifier.lock.json
            ${{ runner.temp }}/legacy-state/relocated/Package.resolved
            ${{ runner.temp }}/legacy-state/relocated/swiftpm-purifier.lock.json
            ${{ runner.temp }}/legacy-state/relocated/.build/swiftpm-purifier/observed-host-runtime.json
          if-no-files-found: error

  original-state-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Prepare the explicit historical runtime fixture
        env:
          LEGACY_SOURCE: ${{ github.workspace }}
        run: |
          nix build --impure --no-link --json --expr '
            let
              f = builtins.getFlake ("path:" + builtins.getEnv "LEGACY_SOURCE");
              p = import f.inputs.nixpkgs { system = builtins.currentSystem; };
            in import (f.outPath + "/tests/sdk/swift311/default.nix") { pkgs = p; }
          ' > "$RUNNER_TEMP/original-runtime-build.json"
          runtime=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))[0]["outputs"]["out"])' "$RUNNER_TEMP/original-runtime-build.json")
          mkdir -p "$RUNNER_TEMP/original-sdk-metadata"
          cp "$runtime/original-tool-bytes.json" "$runtime/original-runtime-bytes.json" "$runtime/original-header-relocations.json" "$RUNNER_TEMP/original-sdk-metadata/"
      - name: Exercise installed runtime capture and cold dependency replay
        run: |
          python3 tests/legacy-state-reader-parity.py --output "$RUNNER_TEMP/original-readers"
          runtime=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))[0]["outputs"]["out"])' "$RUNNER_TEMP/original-runtime-build.json")
          python3 tests/original-state-lifecycle.py --runtime-prefix "$runtime" --pure --output "$RUNNER_TEMP/original-state"
      - name: Retain historical runtime and replay evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: original-state-swift311
          path: |
            ${{ runner.temp }}/original-runtime-build.json
            ${{ runner.temp }}/original-sdk-metadata
            ${{ runner.temp }}/original-readers
            ${{ runner.temp }}/original-state/receipt.json
            ${{ runner.temp }}/original-state/logs
            ${{ runner.temp }}/original-state/native-workspace-state.json
            ${{ runner.temp }}/original-state/fixture-before-capture
            ${{ runner.temp }}/original-state/leaf/Package.swift
            ${{ runner.temp }}/original-state/leaf/Sources
            ${{ runner.temp }}/original-state/remote
            ${{ runner.temp }}/original-state/relocated/Package.swift
            ${{ runner.temp }}/original-state/relocated/Sources
            ${{ runner.temp }}/original-state/relocated/Tests
            ${{ runner.temp }}/original-state/original/Package.pins
            ${{ runner.temp }}/original-state/original/swiftpm-purifier.lock.json
            ${{ runner.temp }}/original-state/relocated/Package.pins
            ${{ runner.temp }}/original-state/relocated/swiftpm-purifier.lock.json
            ${{ runner.temp }}/original-state/relocated/.build/swiftpm-purifier/observed-host-runtime.json
            ${{ runner.temp }}/original-state/tmp/swiftpm-purifier-legacy-capture-*/receipt.json
            ${{ runner.temp }}/original-state/tmp/swiftpm-purifier-legacy-capture-*/logs
            ${{ runner.temp }}/original-state/tmp/swiftpm-purifier-legacy-capture-*/manifest/receipt.json
            ${{ runner.temp }}/original-state/tmp/swiftpm-purifier-legacy-capture-*/manifest/logs
          include-hidden-files: true
          if-no-files-found: error

  pre-workspace-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Prepare the explicit historical runtime fixture
        env:
          LEGACY_SOURCE: ${{ github.workspace }}
        run: |
          nix build --impure --no-link --json --expr '
            let
              f = builtins.getFlake ("path:" + builtins.getEnv "LEGACY_SOURCE");
              p = import f.inputs.nixpkgs { system = builtins.currentSystem; };
            in import (f.outPath + "/tests/sdk/swift302/default.nix") { pkgs = p; }
          ' > "$RUNNER_TEMP/preworkspace-runtime-build.json"
          runtime=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))[0]["outputs"]["out"])' "$RUNNER_TEMP/preworkspace-runtime-build.json")
          mkdir -p "$RUNNER_TEMP/preworkspace-sdk-metadata"
          cp "$runtime/original-tool-bytes.json" "$runtime/original-runtime-bytes.json" "$runtime/original-header-relocations.json" "$RUNNER_TEMP/preworkspace-sdk-metadata/"
      - name: Exercise installed runtime capture and cold dependency replay
        run: |
          python3 tests/pre-workspace-state-parity.py --output "$RUNNER_TEMP/preworkspace-readers"
          runtime=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))[0]["outputs"]["out"])' "$RUNNER_TEMP/preworkspace-runtime-build.json")
          python3 tests/pre-workspace-native-lifecycle.py --runtime-prefix "$runtime" --pure --output "$RUNNER_TEMP/preworkspace-state"
      - name: Retain historical runtime and replay evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preworkspace-state-swift302
          path: |
            ${{ runner.temp }}/preworkspace-runtime-build.json
            ${{ runner.temp }}/preworkspace-sdk-metadata
            ${{ runner.temp }}/preworkspace-readers
            ${{ runner.temp }}/preworkspace-state/receipt.json
            ${{ runner.temp }}/preworkspace-state/logs
            ${{ runner.temp }}/preworkspace-state/http-bodies
            ${{ runner.temp }}/preworkspace-state/cold-objects
            ${{ runner.temp }}/preworkspace-state/owned-install-controls
            ${{ runner.temp }}/preworkspace-state/git-confinement-controls
            ${{ runner.temp }}/preworkspace-state/git-index-controls
            ${{ runner.temp }}/preworkspace-state/fixture-before-capture
            ${{ runner.temp }}/preworkspace-state/leaf/Package.swift
            ${{ runner.temp }}/preworkspace-state/leaf/Sources
            ${{ runner.temp }}/preworkspace-state/remote
            ${{ runner.temp }}/preworkspace-state/original/swiftpm-purifier.lock.json
            ${{ runner.temp }}/preworkspace-state/relocated/Package.swift
            ${{ runner.temp }}/preworkspace-state/relocated/Sources
            ${{ runner.temp }}/preworkspace-state/relocated/Tests
            ${{ runner.temp }}/preworkspace-state/relocated/Packages
            ${{ runner.temp }}/preworkspace-state/relocated/swiftpm-purifier.lock.json
            ${{ runner.temp }}/preworkspace-state/relocated/.build/swiftpm-purifier
            ${{ runner.temp }}/preworkspace-state/tmp/swiftpm-purifier-preworkspace-*/receipt.json
            ${{ runner.temp }}/preworkspace-state/tmp/swiftpm-purifier-preworkspace-*/logs
            ${{ runner.temp }}/preworkspace-state/tmp/swiftpm-purifier-preworkspace-*/native-graph.json
            ${{ runner.temp }}/preworkspace-state/tmp/swiftpm-purifier-preworkspace-*/native-build-plan.yaml
          include-hidden-files: true
          if-no-files-found: error

  host-runtime-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Use the runtime already installed on the runner
        run: python3 tests/host-runtime-lifecycle.py --output "$RUNNER_TEMP/host-runtime"
      - name: Retain host runtime and dependency replay evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: host-runtime
          path: |
            ${{ runner.temp }}/host-runtime/receipt.json
            ${{ runner.temp }}/host-runtime/logs
            ${{ runner.temp }}/host-runtime/original/Package.resolved
            ${{ runner.temp }}/host-runtime/original/swiftpm-purifier.lock.json
            ${{ runner.temp }}/host-runtime/relocated/Package.resolved
            ${{ runner.temp }}/host-runtime/relocated/swiftpm-purifier.lock.json
            ${{ runner.temp }}/host-runtime/relocated/.build/swiftpm-purifier/observed-host-runtime.json
          if-no-files-found: error

  native-sdk-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        epoch: [swift553, default]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Validate native and SDK metadata readers
        run: |
          python3 tests/native-reader-parity.py --output "$RUNNER_TEMP/native-readers"
          python3 tests/sdk-reader-parity.py --output "$RUNNER_TEMP/sdk-readers"
      - name: Exercise the selected native SDK
        run: python3 tests/native-sdk-lifecycle.py --epoch '${{ matrix.epoch }}' --output "$RUNNER_TEMP/native-sdk"
      - name: Retain bounded commands and native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-sdk-${{ matrix.epoch }}
          path: |
            ${{ runner.temp }}/native-readers
            ${{ runner.temp }}/sdk-readers
            ${{ runner.temp }}/native-sdk/receipt.json
            ${{ runner.temp }}/native-sdk/logs
            ${{ runner.temp }}/native-sdk/tmp/swiftpm-purifier-sdk-*/receipt.json
            ${{ runner.temp }}/native-sdk/tmp/swiftpm-purifier-sdk-*/logs
            ${{ runner.temp }}/native-sdk/original/Package.resolved
            ${{ runner.temp }}/native-sdk/original/swiftpm-purifier.lock.json
            ${{ runner.temp }}/native-sdk/relocated/Package.resolved
            ${{ runner.temp }}/native-sdk/relocated/swiftpm-purifier.lock.json
          if-no-files-found: error

  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Build the checks
        run: nix flake check --print-build-logs

  conformance-relock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Relock the fixtures
        run: nix shell 'nixpkgs#python3' -c tests/cli.sh relock

  conformance-rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Rebuild a fixture
        run: nix shell 'nixpkgs#python3' -c tests/cli.sh rebuild

  conformance-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Work with the network cut off
        run: |
          export SWIFTPM_PURIFIER_TEST_OFFLINE="sudo -E unshare -n setpriv --reuid=$(id -u) --regid=$(id -g) --clear-groups"
          nix shell 'nixpkgs#python3' -c tests/cli.sh offline

  conformance-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Update a fixture
        run: nix shell 'nixpkgs#python3' -c tests/cli.sh update

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Run the interactive, tampered and registry sections
        run: nix shell 'nixpkgs#python3' -c tests/cli.sh interactive tampered registry
